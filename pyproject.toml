[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mub"
version = "0.1.0"
description = "MUB-based initialization benchmarks for barren plateaus"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["mub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
